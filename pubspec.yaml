name: quanlychitieu
description: "Mousey - Personal expense & account management application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  path: ^1.8.3
  image_picker: ^1.1.2
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  google_sign_in: ^7.2.0
  http: ^1.2.0
  shared_preferences: ^2.2.3
  path_provider: ^2.1.2
  uuid: ^4.3.0
  crypto: ^3.0.3
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2
  permission_handler: ^11.3.0
  excel: ^4.0.6
  csv: ^6.0.0
  archive: ^3.6.1
  share_plus: ^10.1.2
  firebase_database: ^12.6.0
  bcrypt: ^1.1.3
  google_mlkit_text_recognition: ^0.17.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/avatar/
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/avatar/avatar.jpg"
  min_sdk_android: 23
  adaptive_icon_background: "#CCF7F7"
  adaptive_icon_foreground: "assets/avatar/avatar.jpg"
  adaptive_icon_foreground_inset: 22
