# Render Blueprint: deploy backend-api (FastAPI) lên https://<ten-service>.onrender.com
# Hướng dẫn: backend-api/README.md, mục "Deploy lên Render"
services:
  - type: web
    name: mousey-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend-api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      # Bí mật: nhập trong Render Dashboard, không commit
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false
      # Bảo mật: luôn tắt trên server thật
      - key: ALLOW_UNVERIFIED_TOKEN
        value: "false"
      - key: ENABLE_MOCK_PAY
        value: "false"
      - key: PRICE_MONTHLY
        value: "20000"
      - key: PRICE_YEARLY
        value: "200000"
      - key: ORDER_TTL_MINUTES
        value: "15"
      - key: PAYMENT_BANK_ID
        value: MB
      - key: PAYMENT_BANK_NAME
        value: MB Bank
      - key: PAYMENT_ACCOUNT_NO
        sync: false
      - key: PAYMENT_ACCOUNT_NAME
        sync: false
      - key: PAYMENT_CODE_PREFIX
        value: MSY
      # Quên mật khẩu: gửi mã OTP qua email (Brevo)
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM_EMAIL
        sync: false
      - key: MAIL_FROM_NAME
        value: Mousey
