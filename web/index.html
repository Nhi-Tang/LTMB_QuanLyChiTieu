<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Quản lý chi tiêu cá nhân">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="QuanLyChiTieu">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Quản Lý Chi Tiêu</title>
  <link rel="manifest" href="manifest.json">

  <!-- Style cho Màn hình Chờ (Loading Splash Screen) -->
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f4f6f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    #loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      transition: opacity 0.4s ease-out;
    }

    .app-icon {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      animation: pulse 2s infinite ease-in-out;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(0, 0, 0, 0.08);
      border-top-color: #2196f3; /* Màu xanh chủ đạo - có thể đổi theo app của bạn */
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .loading-text {
      color: #666;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
  </style>
</head>
<body>
  <!-- Giao diện Loading -->
  <div id="loading-container">
    <img class="app-icon" src="icons/Icon-192.png" alt="App Icon" onerror="this.style.display='none'">
    <div class="spinner"></div>
    <div class="loading-text">Đang tải ứng dụng...</div>
  </div>

  <!-- Tự động ẩn loading khi Flutter render xong -->
  <script>
    window.addEventListener('load', function() {
      // Tìm div chứa ứng dụng Flutter sau khi load xong để ẩn loading
      const observer = new MutationObserver(function(mutations, me) {
        const flutterView = document.querySelector('flutter-view');
        if (flutterView) {
          const loader = document.getElementById('loading-container');
          if (loader) {
            loader.style.opacity = '0';
            setTimeout(() => loader.remove(), 400);
          }
          me.disconnect();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
